name: Plugin package

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

# GitHub occasionally delivers one push twice (v1.5.6 got two tag runs on the
# same SHA). Serialize runs per ref so the duplicate cannot race the release.
concurrency:
  group: plugin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: Test routing graders and local MCP fixtures
        run: |
          gem install rspec --no-document
          rspec spec/routing_eval_spec.rb
      - name: Test release tooling
        run: python3 -m unittest discover -s tests -v
      - name: Refresh generated plugins
        run: scripts/sync-plugin.sh --no-local-links
      - name: Require committed plugin output
        run: |
          git status --porcelain --untracked-files=all -- plugins/astria plugins/astria-claude > /tmp/astria-plugin-status
          if [ -s /tmp/astria-plugin-status ]; then
            cat /tmp/astria-plugin-status
            echo "Run scripts/sync-plugin.sh and commit both generated packages."
            exit 1
          fi
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/validate-plugin.py --expected-version "${GITHUB_REF_NAME#v}"
      - name: Validate plugin
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: scripts/validate-plugin.py
      - name: Build upload archive
        run: |
          scripts/build-plugin.py dist
          scripts/build-plugin.py dist --target claude
      - uses: actions/upload-artifact@v4
        with:
          name: astria-plugin
          path: |
            dist/*.zip
            dist/*.sha256
  publish-tagged-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: astria-plugin
          path: dist
      - name: Publish tagged GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; replacing its assets."
            gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 --generate-notes --verify-tag --repo "$GITHUB_REPOSITORY"
          fi
